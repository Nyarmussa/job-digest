name: Job Dashboard (Mon/Wed/Fri)

on:
  schedule:
    # 12:00 UTC on Mon, Wed, Fri (~06:00 Mountain). Builds docs/ and publishes to GitHub Pages.
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the refreshed docs/ back to the repo

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so rebase-before-push works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        env:
          OPENWEBNINJA_API_KEY: ${{ secrets.OPENWEBNINJA_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
        run: python main.py dashboard

      - name: Commit updated dashboard
        run: |
          git config user.name  "job-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Dashboard refresh $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes to commit"; exit 0; }
          # Rebase onto the latest remote and push, retrying if another commit races us.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push race detected, retry $i..."; sleep 3
          done
          echo "Push failed after retries"; exit 1
